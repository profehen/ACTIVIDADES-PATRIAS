<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reforestación</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }

    header {
      background-color: #2e7d32;
      color: white;
      text-align: center;
      padding: 2rem 1rem;
    }

    .content-box {
      background-color: #d0f0c0;
      margin: 2rem auto;
      padding: 1.5rem;
      width: 80%;
      border-radius: 10px;
    }

    .carousel {
      position: relative;
      width: 80%;
      margin: 2rem auto;
      overflow: hidden;
      border-radius: 10px;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .carousel-track {
      display: flex;
      transition: transform 0.5s ease;
    }

    .carousel-item {
      min-width: 100%;
      box-sizing: border-box;
      text-align: center;
      padding: 1rem;
    }

    .carousel-item img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 1rem;
    }

    .carousel-buttons {
      display: flex;
      justify-content: space-between;
      width: 80%;
      margin: 0 auto;
      padding: 1rem 0;
    }

    .carousel-buttons button {
      padding: 0.5rem 1rem;
      background: #2e7d32;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    .gallery {
      width: 80%;
      margin: 2rem auto;
      background: #ffffff;
      padding: 1.5rem
